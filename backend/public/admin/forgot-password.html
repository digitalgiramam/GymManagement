<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Super Admin Portal</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Forgot Password</h1>
      <p class="sub">Enter your admin email and we'll send you a link to reset your password.</p>

      <div class="error-box" id="errorBox"></div>
      <div class="error-box" id="successBox" style="background:rgba(111,227,163,.1); border-color:#2a5c3f; color:#6fe3a3;"></div>

      <form id="forgotForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" placeholder="admin@platform.local">

        <button type="submit" class="btn-primary" id="submitBtn">Send Reset Link</button>
      </form>

      <p style="text-align:center; margin-top:16px; margin-bottom:0;">
        <a href="login.html" style="font-size:13px;">&larr; Back to login</a>
      </p>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    const form      = document.getElementById('forgotForm');
    const errorBox  = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      const email = document.getElementById('email').value.trim();

      try {
        const res = await fetch('/api/admin/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');

        successBox.textContent = data.message || 'If an account exists for that email, a password reset link has been sent.';
        successBox.style.display = 'block';
        form.reset();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
