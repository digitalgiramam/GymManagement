<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin Login — Gym SaaS Platform</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Platform Admin</h1>
      <p class="sub">Sign in to manage all gyms on the platform.</p>

      <div class="error-box" id="errorBox"></div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" placeholder="admin@platform.local">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">

        <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    // If already logged in, skip straight to the dashboard.
    if (getAdminToken()) window.location.href = 'dashboard.html';

    const form      = document.getElementById('loginForm');
    const errorBox  = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed.');

        setAdminAuth(data.token, data.admin);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
