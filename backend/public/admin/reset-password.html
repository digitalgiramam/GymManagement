<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Super Admin Portal</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Reset Password</h1>
      <p class="sub">Choose a new password for your admin account.</p>

      <div class="error-box" id="errorBox"></div>

      <form id="resetForm">
        <label for="password">New Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password" placeholder="Re-enter password">

        <button type="submit" class="btn-primary" id="submitBtn">Reset Password</button>
      </form>

      <p style="text-align:center; margin-top:16px; margin-bottom:0;">
        <a href="login.html" style="font-size:13px;">&larr; Back to login</a>
      </p>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const form      = document.getElementById('resetForm');
    const errorBox  = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    if (!token) {
      errorBox.textContent = 'This reset link is missing its token. Please request a new one from the login page.';
      errorBox.style.display = 'block';
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting…';

      try {
        const res = await fetch('/api/admin/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');

        alert('Password reset successfully. Please sign in.');
        window.location.href = 'login.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
