org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# Required: prevents AGP from registering its own 'kotlin' extension, which
# would conflict with the explicit org.jetbrains.kotlin.android plugin in app/build.gradle.
android.builtInKotlin=false

# Required by a transitive plugin that still uses the legacy variant API
# (applicationVariants / testVariants / unitTestVariants).
# Remove once all plugins migrate to AndroidComponentsExtension.
android.newDsl=false

# Suppress AGP 9.x deprecation warnings that cannot be removed yet
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
